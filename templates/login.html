<!DOCTYPE html>
<html>
<head>
    <title>Admin Login</title>
</head>
<body>
    <h1>Admin Login</h1>

    {% if error %}
        <p style="color: red;">{{ error }}</p>
    {% endif %}

    <form action="{{ url_for('login') }}" method="post">
        <p>
            <label for="password">Password:</label><br>
            <input type="password" id="password" name="password">
        </p>
        <p>
            <input type="submit" value="Log In">
        </p>
    </form>
</body>
</html>
