<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.01//EN"
    "http://www.w3.org/TR/html4/strict.dtd">
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>{% block title %}Inquiry Manager{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="page">
    <div class="header">
        <div class="header-inner">
            <h1><a href="{{ url_for('home') }}" data-i18n="brand">Inquiry Manager</a></h1>
            <div class="header-subtitle" data-i18n="subtitle">Customer inquiry tracking</div>
        </div>
    </div>

    <div class="navigation">
        <a href="{{ url_for('login') }}" data-i18n="nav.inquiries">Inquiries</a>
        <a href="{{ url_for('new_complaint') }}" data-i18n="nav.newInquiry">New Inquiry</a>
    </div>

    <div class="content">
        {% block content %}{% endblock %}
    </div>

    <div class="footer">
        InquiryResolverIQ | Built for HackTheHill III
    </div>
</div>

<script type="text/javascript" src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
